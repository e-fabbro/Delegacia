[project]
name = "agencia"
version = "0.0.1"
description = "Agência Nexo — pacote determinístico de análise investigativa (DRCC/DECOR/PCDF)"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "pdfplumber>=0.11",
    "markitdown>=0.1",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
    "networkx>=3.3",
    "python-docx>=1.1",
    "cryptography>=42",      # cifragem do pacote de arquivamento (caso arquivar); já era dependência transitiva
]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agencia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
